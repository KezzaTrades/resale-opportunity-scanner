name: Resale engine tests
on:
  pull_request:
  push:
    branches: [feature/real-scanning-financial-engine]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m scanner.cli --no-network
