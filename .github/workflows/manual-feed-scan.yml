name: Manual authorised feed scan
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load opted-in licensed feed and preview alerts
        env:
          RESALE_APPROVED_FEED_URL: ${{ secrets.RESALE_APPROVED_FEED_URL }}
          RESALE_APPROVED_FEED_HOST: ${{ secrets.RESALE_APPROVED_FEED_HOST }}
        run: |
          python scanner.py feed
          python scanner.py alerts
